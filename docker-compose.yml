services:
  backend:
    build: ./backend
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3:8b
      - CORS_ORIGINS=http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [ollama]
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes: { ollama: {} }
